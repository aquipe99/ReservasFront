<div class="card">
  <p-breadcrumb [model]="breadcrumbItems" [home]="breadcrumbHome"></p-breadcrumb>
</div>

<p-toolbar styleClass="mb-6">
  <ng-template #start>
    <div class="font-semibold text-xl">Gestión de Permisos por Rol</div>
  </ng-template>
  <ng-template #end>
    <div class="flex flex-col md:flex-row items-stretch md:items-center gap-3">
      <label for="roleId" class="font-semibold">Rol</label>
      <p-select
        id="roleId"
        [options]="roles()"
        [(ngModel)]="selectedRoleId"
        optionLabel="name"
        optionValue="id"
        placeholder="Seleccione un rol"
        [showClear]="true"
        (onChange)="onRoleChange()"
        styleClass="w-full md:w-64"
      ></p-select>

      @if(canUpdate()) {
      <p-button
        label="Guardar"
        icon="pi pi-save"
        [loading]="saving"
        [disabled]="selectedRoleId === null || loading"
        (onClick)="save()"
      />
      }
    </div>
  </ng-template>
</p-toolbar>

<p-treetable
  [value]="treeNodes()"
  [loading]="loading"
  [scrollable]="true"
  [tableStyle]="{ 'min-width': '52rem' }"
>
  <ng-template #header>
    <tr>
      <th style="min-width: 24rem">Menú</th>
      <th class="text-center" style="width: 7rem">Leer</th>
      <th class="text-center" style="width: 7rem">Crear</th>
      <th class="text-center" style="width: 9rem">Actualizar</th>
      <th class="text-center" style="width: 8rem">Eliminar</th>
    </tr>
  </ng-template>

  <ng-template #body let-rowNode let-rowData="rowData">
    <tr [ttRow]="rowNode">
      <td>
        <div class="flex items-center gap-2">
          <p-treeTableToggler [rowNode]="rowNode" />
          @if(rowData.menuIcon) {
          <i [class]="rowData.menuIcon"></i>
          }
          <span>{{ rowData.menuDescription }}</span>
        </div>
      </td>

      @if(isGroupMenu(rowData)) {
      <td class="text-center text-surface-400">—</td>
      <td class="text-center text-surface-400">—</td>
      <td class="text-center text-surface-400">—</td>
      <td class="text-center text-surface-400">—</td>
      } @else {
      <td class="text-center">
        <p-checkbox
          [(ngModel)]="rowData.canRead"
          [binary]="true"
          [disabled]="!canUpdate()"
        ></p-checkbox>
      </td>
      <td class="text-center">
        <p-checkbox
          [(ngModel)]="rowData.canCreate"
          [binary]="true"
          [disabled]="!canUpdate()"
        ></p-checkbox>
      </td>
      <td class="text-center">
        <p-checkbox
          [(ngModel)]="rowData.canUpdate"
          [binary]="true"
          [disabled]="!canUpdate()"
        ></p-checkbox>
      </td>
      <td class="text-center">
        <p-checkbox
          [(ngModel)]="rowData.canDelete"
          [binary]="true"
          [disabled]="!canUpdate()"
        ></p-checkbox>
      </td>
      }
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="5" class="!text-center py-6 text-gray-500">
        <i class="pi pi-info-circle mr-2"></i>
        <span class="font-semibold">
          {{ selectedRoleId === null ? 'Seleccione un rol' : 'No se encontraron menús' }}
        </span>
      </td>
    </tr>
  </ng-template>
</p-treetable>
