<div class="card">
  <p-breadcrumb [model]="breadcrumbItems" [home]="breadcrumbHome"></p-breadcrumb>
</div>

<p-toolbar styleClass="mb-6">
  <ng-template #start>
    <div class="font-semibold text-xl">Listado Roles</div>
  </ng-template>
  <ng-template #end>
    @if(canCreate()){
    <p-button
      label="Nuevo Rol"
      icon="pi pi-plus"
      severity="success"
      class="mr-2"
      (onClick)="openNew()"
    />
    }
  </ng-template>
</p-toolbar>

<p-table
  #dt
  [value]="roles()"
  [lazy]="true"
  (onLazyLoad)="load($event)"
  [paginator]="true"
  [rows]="10"
  [totalRecords]="totalRecords"
  [loading]="loading"
  [tableStyle]="{ 'min-width': '75rem' }"
  dataKey="id"
  currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
  [rowsPerPageOptions]="[10, 20, 30]"
>
  <ng-template #caption>
    <div class="flex items-center justify-between">
      <h5 class="m-0"></h5>
      <p-iconfield>
        <p-inputicon styleClass="pi pi-search" />
        <input pInputText type="text" (input)="onSearch($event)" placeholder="Buscar..." />
      </p-iconfield>
    </div>
  </ng-template>
  <ng-template #header>
    <tr>
      <th pSortableColumn="name" style="min-width: 16rem">
        Nombre
        <p-sortIcon field="name" />
      </th>
      <th style="min-width: 12rem">Acciones</th>
    </tr>
  </ng-template>
  <ng-template #body let-role>
    <tr>
      <td style="min-width: 16rem">{{ role.name }}</td>
      <td>
        @if(canUpdate()) {
        <p-button
          icon="pi pi-pencil"
          label="Editar"
          class="mr-2"
          [rounded]="true"
          [outlined]="true"
          (click)="edit(role)"
        />
        } @if (canDelete()) {
        <p-button
          icon="pi pi-trash"
          label="Eliminar"
          severity="danger"
          [rounded]="true"
          [outlined]="true"
          (click)="remove(role)"
        />
        }
      </td>
    </tr>
  </ng-template>
  <ng-template #emptymessage>
    <tr>
      <td colspan="2" class="!text-center py-6 text-gray-500">
        <i class="pi pi-info-circle mr-2"></i>
        <span class="font-semibold">No se encontraron registros</span>
      </td>
    </tr>
  </ng-template>
</p-table>

<p-dialog
  [(visible)]="dialogVisible"
  [style]="{ width: '450px' }"
  [header]="dialogMode === 'create' ? 'Nuevo Rol' : 'Editar Rol'"
  [modal]="true"
>
  <ng-template #content>
    <div class="flex flex-col gap-6">
      <div>
        <label for="name" class="block font-bold mb-3">Nombre</label>
        <input type="text" pInputText id="name" [(ngModel)]="role.name" required autofocus fluid />
        <small class="text-red-500" *ngIf="submitted && backendErrors['name']"
          >{{ backendErrors['name'] }}
        </small>
      </div>
    </div>
  </ng-template>

  <ng-template #footer>
    <p-button label="Cancelar" icon="pi pi-times" text (click)="dialogVisible = false" />
    <p-button label="Guardar" icon="pi pi-check" (click)="role.id ? update() : save()" />
  </ng-template>
</p-dialog>

<p-confirmdialog [style]="{ width: '450px' }" />
